<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — KAIRO</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root { --charcoal:#1D201E; --gold:#FCCD00; --white:#E7EDE3; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; justify-content:space-between;
           padding:24px clamp(16px,4vw,56px); background:var(--charcoal); color:var(--white); font-family:Inter,system-ui,sans-serif; overflow:hidden; }
    a { color:inherit; text-decoration:none; }
    .logo { font-family:"Inter Tight",sans-serif; font-weight:800; font-size:22px; letter-spacing:-.03em; }
    .logo sup { font-size:10px; color:var(--gold); }
    h1 { margin:0; font-family:"Inter Tight",sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:-.06em; line-height:.85; font-size:clamp(120px,32vw,420px); color:var(--gold); }
    p { margin:0 0 28px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.6; }
    .btn { display:inline-flex; align-items:center; height:54px; padding:0 28px; background:var(--gold); color:var(--charcoal);
           font-size:12px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; transition:background .3s; }
    .btn:hover { background:var(--white); }
  </style>
</head>
<body>
  <a href="./" class="logo" data-home>KAIRO<sup>®</sup></a>
  <main>
    <h1>404</h1>
    <p>This page wandered off. Let's get you back.</p>
    <a class="btn" href="./" data-home>Back to home ↗</a>
  </main>
  <span></span>
  <script>
    // On a GitHub project site (username.github.io/repo-name) home is /repo-name/, elsewhere it's /
    var home = location.hostname.endsWith("github.io") && location.pathname.split("/")[1]
      ? "/" + location.pathname.split("/")[1] + "/" : "/";
    document.querySelectorAll("[data-home]").forEach(function (a) { a.href = home; });
  </script>
</body>
</html>
